<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Placar — futebol, NBA e F1 ao vivo</title>
  <meta name="description" content="Placares ao vivo, tabelas, estatísticas e onde assistir: futebol brasileiro e europeu, NBA e Fórmula 1.">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('placar.theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
